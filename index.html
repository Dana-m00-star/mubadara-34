<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>المادة 34</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #f8f4e9;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .poster {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 8px 8px;
            background: #f8f4e9;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .paper {
            width: 100%;
            max-width: 1600px;
            margin: 0 auto;
            text-align: center;
        }

        /* العنوان الرئيسي */
        h1 {
            color: #174b38;
            font-size: clamp(42px, 5.8vw, 60px);
            margin: 0 0 5px;
            font-weight: 900;
        }

        /* عبارة الدفاع عن العقيدة */
        .description {
            color: #174b38;
            font-size: clamp(23px, 3.2vw, 31px);
            font-weight: 900;
            line-height: 1.5;
            max-width: 1200px;
            margin: 0 auto 8px;
        }

        /* صف الخريطة والخطوط */
        .map-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin: 3px auto 8px;
        }

        /* الخريطة أكبر */
        .map {
            flex: 0 1 560px;
            width: 560px;
            max-width: 54%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        .map img {
            display: block;
            width: 100%;
            max-height: 390px;
            height: auto;
            object-fit: contain;
            margin: 0;
            padding: 0;
        }

        /* الخطوط التفاعلية: أنحف وملاصقة للخريطة */
        .signature-line {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            max-width: none;
            height: 100px;
            border-top: 1px solid #aaa493;
            border-bottom: 1px solid #aaa493;
            cursor: pointer;
            touch-action: manipulation;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.12);
            margin: 0;
            padding: 0;
        }

        .signature-line:focus-visible {
            outline: 2px solid #174b38;
            outline-offset: 1px;
        }

        /* القلوب */
        .heart {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: clamp(18px, 2.7vw, 29px);
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        /* الشعار أكبر */
        .slogan {
            font-size: clamp(31px, 4.5vw, 43px);
            font-weight: 900;
            line-height: 1.5;
            margin: 5px 0 0;
        }

        .green {
            color: #174b38;
        }

        .red {
            color: #c51d3b;
        }

        .flag {
            display: inline-block;
            margin-right: 3px;
        }

        /* أسماء الإعداد */
        .credits {
            color: #174b38;
            font-size: clamp(16px, 2.1vw, 20px);
            font-weight: bold;
            line-height: 1.5;
            margin: 4px auto 0;
            padding: 0;
        }

        .hint {
            color: #777064;
            font-size: 12px;
            margin: 4px 0 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin: 5px 0 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 7px 14px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            background: #174b38;
            color: white;
        }

        button:hover {
            background: #22694d;
        }

        /* الآيباد */
        @media (min-width: 600px) and (max-width: 1100px) {
            .poster {
                padding: 8px 5px;
                justify-content: space-evenly;
            }

            h1 {
                font-size: 49px;
                margin-bottom: 5px;
            }

            .description {
                font-size: 25px;
                line-height: 1.5;
                margin-bottom: 6px;
            }

            .map-row {
                gap: 0;
                margin: 3px 0 6px;
            }

            .map {
                flex: 0 1 470px;
                max-width: 56%;
            }

            .map img {
                max-height: 340px;
            }

            .signature-line {
                height: 90px;
                border-top-width: 1px;
                border-bottom-width: 1px;
            }

            .heart {
                font-size: 24px;
            }

            .slogan {
                font-size: 35px;
                margin-top: 4px;
            }

            .credits {
                font-size: 18px;
                margin-top: 3px;
            }

            .hint {
                font-size: 11px;
                margin-top: 3px;
            }

            .buttons {
                margin-top: 4px;
            }

            button {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* الجوال */
        @media (max-width: 599px) {
            .poster {
                padding: 12px 4px;
                min-height: 100vh;
                min-height: 100dvh;
            }

            h1 {
                font-size: 43px;
                margin-bottom: 6px;
            }

            .description {
                font-size: 21px;
                line-height: 1.6;
                margin-bottom: 7px;
                padding: 0 4px;
            }

            .map-row {
                gap: 0;
                margin: 5px auto 8px;
            }

            .map {
                flex: 0 1 62%;
                max-width: 62%;
            }

            .map img {
                max-height: 300px;
            }

            .signature-line {
                flex: 1 1 0;
                height: 75px;
                border-top-width: 1px;
                border-bottom-width: 1px;
            }

            .heart {
                font-size: 19px;
            }

            .slogan {
                font-size: 29px;
                line-height: 1.6;
                margin-top: 4px;
            }

            .credits {
                font-size: 15px;
                margin-top: 5px;
            }

            .hint {
                font-size: 11px;
            }

            .buttons {
                margin-top: 7px;
            }
        }

        /* الجوالات الصغيرة */
        @media (max-width: 360px) {
            .poster {
                padding: 8px 3px;
            }

            h1 {
                font-size: 37px;
            }

            .description {
                font-size: 18px;
            }

            .map {
                flex-basis: 62%;
                max-width: 62%;
            }

            .map img {
                max-height: 260px;
            }

            .signature-line {
                height: 65px;
            }

            .slogan {
                font-size: 24px;
            }

            .credits {
                font-size: 13px;
            }
        }

        /* الشاشات القصيرة */
        @media (min-width: 600px) and (max-height: 750px) {
            .poster {
                padding-top: 3px;
                padding-bottom: 3px;
            }

            h1 {
                font-size: 41px;
            }

            .description {
                font-size: 22px;
            }

            .map img {
                max-height: 260px;
            }

            .signature-line {
                height: 75px;
            }

            .slogan {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <main class="poster">

        <section class="paper">

            <h1>المادة 34</h1>

            <p class="description">
                الدفاع عن العقيدة الإسلامية،
                والمجتمع، والوطن،
                واجب على كل مواطن.
            </p>

            <div class="map-row">

                <!-- الخط التفاعلي الأول -->
                <div
                    class="signature-line"
                    tabindex="0"
                    role="button"
                    aria-label="اضغطي لإضافة قلب بجانب الخريطة">
                </div>

                <!-- خريطة المملكة العربية السعودية -->
                <div class="map">
                    <img
                        src="sa.svg"
                        alt="خريطة المملكة العربية السعودية">
                </div>

                <!-- الخط التفاعلي الثاني -->
                <div
                    class="signature-line"
                    tabindex="0"
                    role="button"
                    aria-label="اضغطي لإضافة قلب بجانب الخريطة">
                </div>

            </div>

            <p class="slogan">
                <span class="green">بصمة دفاع.. السعودية</span>
                <span class="red">خط أحمر</span>
                <span class="flag">🇸🇦</span>
            </p>

            <footer class="credits">
                إعداد: أ/ نوال الثبيتي - أ/ ساره الثبيتي
            </footer>

            <p class="hint">
                اضغطي على الخط بجانب الخريطة واتركي بصمتك ❤️
            </p>

            <div class="buttons">
                <button id="clearButton" type="button">
                    إعادة من البداية ↺
                </button>
            </div>

        </section>

    </main>

    <script>
        const lines = document.querySelectorAll(".signature-line");
        const storageKey = "mubadara34-hearts-v2";

        function saveHearts() {
            const data = [...lines].map(line =>
                [...line.querySelectorAll(".heart")].map(heart => ({
                    x: Number(heart.dataset.x),
                    y: Number(heart.dataset.y)
                }))
            );

            try {
                localStorage.setItem(storageKey, JSON.stringify(data));
            } catch (error) {
                console.log("تعذر حفظ البصمات");
            }
        }

        function addHeart(line, x, y, save = true) {
            if (line.querySelectorAll(".heart").length >= 100) {
                return;
            }

            const heart = document.createElement("span");

            heart.className = "heart";
            heart.textContent = "❤️";
            heart.style.left = x + "%";
            heart.style.top = y + "%";
            heart.dataset.x = x;
            heart.dataset.y = y;

            line.appendChild(heart);

            if (save) {
                saveHearts();
            }
        }

        function placeHeart(line, clientX, clientY) {
            const rect = line.getBoundingClientRect();

            if (!rect.width || !rect.height) {
                return;
            }

            const x = Math.max(
                5,
                Math.min(95, ((clientX - rect.left) / rect.width) * 100)
            );

            const y = Math.max(
                15,
                Math.min(85, ((clientY - rect.top) / rect.height) * 100)
            );

            addHeart(line, x, y);
        }

        lines.forEach(line => {
            line.addEventListener("click", event => {
                placeHeart(line, event.clientX, event.clientY);
            });

            line.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();

                    const rect = line.getBoundingClientRect();

                    placeHeart(
                        line,
                        rect.left + rect.width / 2,
                        rect.top + rect.height / 2
                    );
                }
            });
        });

        function loadHearts() {
            try {
                const data = JSON.parse(
                    localStorage.getItem(storageKey) || "[]"
                );

                data.forEach((hearts, index) => {
                    if (!lines[index] || !Array.isArray(hearts)) {
                        return;
                    }

                    hearts.forEach(heart => {
                        if (
                            typeof heart.x === "number" &&
                            typeof heart.y === "number"
                        ) {
                            addHeart(
                                lines[index],
                                heart.x,
                                heart.y,
                                false
                            );
                        }
                    });
                });
            } catch (error) {
                console.log("تعذر استعادة البصمات");
            }
        }

        document
            .getElementById("clearButton")
            .addEventListener("click", () => {
                lines.forEach(line => line.replaceChildren());

                try {
                    localStorage.removeItem(storageKey);
                } catch (error) {
                    console.log("تعذر مسح البصمات");
                }
            });

        loadHearts();
    </script>

</body>

</html>
