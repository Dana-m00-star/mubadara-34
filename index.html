<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مبادرة جميلة | المادة 34</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #f8f4e9;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .poster {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 8px 12px;
            background: #f8f4e9;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* العنوان العلوي */
        .top {
            color: #174b38;
            text-align: center;
            font-size: clamp(20px, 2.6vw, 27px);
            font-weight: bold;
            padding: 2px 0 5px;
        }

        .paper {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            text-align: center;
        }

        /* العنوان الرئيسي: المادة 34 */
        h1 {
            color: #174b38;
            font-size: clamp(48px, 6.5vw, 68px);
            margin: 0 0 8px;
            font-weight: 900;
            line-height: 1.2;
        }

        /* نص المادة */
        .description {
            color: #174b38;
            font-size: clamp(22px, 3vw, 30px);
            font-weight: bold;
            line-height: 1.6;
            max-width: 1100px;
            margin: 0 auto 10px;
        }

        /* الخريطة والخطان */
        .map-row {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 0;
            margin: 4px auto 7px;
        }

        /* تكبير مساحة الخريطة */
        .map {
            flex: 0 1 500px;
            width: 500px;
            max-width: 52%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .map img {
            display: block;
            width: 100%;
            max-height: 400px;
            height: auto;
            object-fit: contain;
        }

        /* الخطوط التفاعلية */
        .signature-line {
    position: relative;
    flex: 1 1 0;
    min-width: 0;
    max-width: none;
    height: 110px;
    border-top: 2px solid #aaa493;
    border-bottom: 2px solid #aaa493;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.16);
    outline: none;
    box-shadow: none;
    filter: none;
}
        .signature-line:focus-visible {
            outline: 2px solid #174b38;
            outline-offset: 2px;
        }

        /* القلوب */
        .heart {
            position: absolute;
            transform: translate(-50%, -50%);
            font-size: clamp(18px, 2.7vw, 29px);
            pointer-events: none;
            user-select: none;
            line-height: 1;
        }

        /* جملة بصمة دفاع */
        .slogan {
            font-size: clamp(30px, 4.2vw, 42px);
            font-weight: 900;
            line-height: 1.5;
            margin: 6px 0 0;
        }

        .green {
            color: #174b38;
        }

        .red {
            color: #c51d3b;
        }

        .flag {
            display: inline-block;
            margin-right: 3px;
        }

        /* أسماء الإعداد */
        .credits {
            color: #174b38;
            font-size: clamp(15px, 2vw, 19px);
            font-weight: bold;
            line-height: 1.5;
            margin: 4px auto 0;
            padding: 0;
        }

        .hint {
            color: #777064;
            font-size: 12px;
            margin: 4px 0 0;
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin: 5px 0 0;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 7px 14px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            background: #174b38;
            color: white;
        }

        button:hover {
            background: #22694d;
        }

       /* ضبط الآيباد: أحجام كبيرة وواضحة */
@media (min-width: 600px) and (max-width: 1100px) {

    .poster {
        padding: 12px 16px;
        justify-content: center;
    }

    .paper {
        width: 100%;
        max-width: none;
    }

    .top {
        font-size: 28px;
        padding: 4px 0 8px;
    }

    h1 {
        font-size: 68px;
        margin: 0 0 14px;
        line-height: 1.25;
    }

    .description {
        font-size: 30px;
        line-height: 1.7;
        max-width: 100%;
        margin: 0 auto 16px;
    }

    .map-row {
        width: 100%;
        gap: 0;
        margin: 10px auto 14px;
        align-items: center;
    }

    .map {
        flex: 0 1 55%;
        width: 55%;
        max-width: 55%;
        min-width: 0;
    }

    .map img {
        width: 100%;
        max-height: 450px;
        height: auto;
        object-fit: contain;
    }

    .signature-line {
        flex: 1 1 0;
        min-width: 0;
        height: 120px;
    }

    .heart {
        font-size: 27px;
    }

    .slogan {
        font-size: 40px;
        line-height: 1.5;
        margin: 10px 0 0;
    }

    .credits {
        font-size: 20px;
        margin-top: 8px;
    }

    .hint {
        font-size: 14px;
        margin-top: 6px;
    }

    .buttons {
        margin-top: 8px;
    }

    button {
        padding: 9px 16px;
        font-size: 15px;
    }
}

        /* ضبط الجوال */
        @media (max-width: 599px) {
            .poster {
                padding: 12px 8px;
                min-height: 100vh;
                min-height: 100dvh;
            }

            .top {
                font-size: 20px;
                padding-bottom: 6px;
            }

            h1 {
                font-size: 43px;
                margin-bottom: 8px;
            }

            .description {
                font-size: 20px;
                line-height: 1.6;
                margin-bottom: 10px;
            }

            .map-row {
                gap: 0;
                margin: 6px auto 10px;
            }

            .map {
                flex: 0 1 58%;
                max-width: 58%;
            }

            .map img {
                max-height: 300px;
            }

            .signature-line {
                flex: 1 1 0;
                height: 80px;
            }

            .heart {
                font-size: 19px;
            }

            .slogan {
                font-size: 27px;
                line-height: 1.6;
                margin-top: 5px;
            }

            .credits {
                font-size: 15px;
                margin-top: 5px;
            }

            .hint {
                font-size: 11px;
            }

            .buttons {
                margin-top: 7px;
            }
        }

        /* الجوالات الصغيرة */
        @media (max-width: 360px) {
            .poster {
                padding: 8px 5px;
            }

            .map-row {
                gap: 0;
            }

            .map {
                flex-basis: 58%;
                max-width: 58%;
            }

            .map img {
                max-height: 230px;
            }

            .signature-line {
                height: 65px;
            }

            h1 {
                font-size: 38px;
            }

            .description {
                font-size: 17px;
            }

            .slogan {
                font-size: 22px;
            }

            .credits {
                font-size: 13px;
            }
        }

       
    </style>
</head>

<body>

    <main class="poster">

        

        <section class="paper">

            <h1>المادة 34</h1>

            <p class="description">
                الدفاع عن العقيدة الإسلامية،
                والمجتمع، والوطن،
                واجب على كل مواطن.
            </p>

            <div class="map-row">

                <!-- خط القلوب على يمين الخريطة -->
                <div
                    class="signature-line"
                    tabindex="0"
                    role="button"
                    aria-label="اضغطي لإضافة قلب على يمين الخريطة">
                </div>

                <!-- خريطة المملكة العربية السعودية -->
                <div class="map">
                    <img
                        src="sa.svg"
                        alt="خريطة المملكة العربية السعودية">
                </div>

                <!-- خط القلوب على يسار الخريطة -->
                <div
                    class="signature-line"
                    tabindex="0"
                    role="button"
                    aria-label="اضغطي لإضافة قلب على يسار الخريطة">
                </div>

            </div>

            <p class="slogan">
                <span class="green">بصمة دفاع.. السعودية</span>
                <span class="red">خط أحمر</span>
                <span class="flag">🇸🇦</span>
            </p>

            <footer class="credits">
               إعداد: أ/ حصه العتيبي 
            </footer>

            <p class="hint">
                اضغطي على الخط بجانب الخريطة واتركي بصمتك ❤️
            </p>

            <div class="buttons">
                <button id="clearButton" type="button">
                    إعادة من البداية ↺
                </button>
            </div>

        </section>

    </main>

    <script>
        const lines = document.querySelectorAll(".signature-line");
        const storageKey = "mubadara34-hearts-v2";

        function saveHearts() {
            const data = [...lines].map(line =>
                [...line.querySelectorAll(".heart")].map(heart => ({
                    x: Number(heart.dataset.x),
                    y: Number(heart.dataset.y)
                }))
            );

            try {
                localStorage.setItem(storageKey, JSON.stringify(data));
            } catch (error) {
                console.log("تعذر حفظ البصمات");
            }
        }

        function addHeart(line, x, y, save = true) {
            if (line.querySelectorAll(".heart").length >= 100) {
                return;
            }

            const heart = document.createElement("span");

            heart.className = "heart";
            heart.textContent = "❤️";
            heart.style.left = x + "%";
            heart.style.top = y + "%";
            heart.dataset.x = x;
            heart.dataset.y = y;

            line.appendChild(heart);

            if (save) {
                saveHearts();
            }
        }

        function placeHeart(line, clientX, clientY) {
            const rect = line.getBoundingClientRect();

            const x = Math.max(
                5,
                Math.min(95, ((clientX - rect.left) / rect.width) * 100)
            );

            const y = Math.max(
                15,
                Math.min(85, ((clientY - rect.top) / rect.height) * 100)
            );

            addHeart(line, x, y);
        }

        lines.forEach(line => {
            line.addEventListener("click", event => {
                placeHeart(line, event.clientX, event.clientY);
            });

            line.addEventListener("keydown", event => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();

                    const rect = line.getBoundingClientRect();

                    placeHeart(
                        line,
                        rect.left + rect.width / 2,
                        rect.top + rect.height / 2
                    );
                }
            });
        });

        function loadHearts() {
            try {
                const data = JSON.parse(
                    localStorage.getItem(storageKey) || "[]"
                );

                data.forEach((hearts, index) => {
                    if (!lines[index] || !Array.isArray(hearts)) {
                        return;
                    }

                    hearts.forEach(heart => {
                        if (
                            typeof heart.x === "number" &&
                            typeof heart.y === "number"
                        ) {
                            addHeart(
                                lines[index],
                                heart.x,
                                heart.y,
                                false
                            );
                        }
                    });
                });
            } catch (error) {
                console.log("تعذر استعادة البصمات");
            }
        }

        document
            .getElementById("clearButton")
            .addEventListener("click", () => {
                lines.forEach(line => line.replaceChildren());

                try {
                    localStorage.removeItem(storageKey);
                } catch (error) {
                    console.log("تعذر مسح البصمات");
                }
            });

        loadHearts();
    </script>

</body>

</html>
