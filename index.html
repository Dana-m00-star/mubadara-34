<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبادرة جميلة - المادة 34</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #171923;
            font-family: Tahoma, Arial, sans-serif;
            color: #292b35;
        }

        .page {
            max-width: 900px;
            margin: 0 auto;
            background-color: #f8f4e9;
            padding: 35px;
            border: 5px solid #c5b58b;
            outline: 2px solid #f8f4e9;
            outline-offset: -12px;
            min-height: 700px;
            text-align: center;
        }

        .header {
            font-size: 23px;
            font-weight: bold;
            color: #171923;
            margin-bottom: 25px;
        }

        .title {
            font-size: 58px;
            font-weight: bold;
            color: #a52530;
            margin: 10px 0;
        }

        .article {
            font-size: 25px;
            font-weight: bold;
            line-height: 2;
            margin: 15px auto;
            max-width: 700px;
        }

        .map-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 25px auto;
            max-width: 650px;
        }

        .red-line {
            flex: 1;
            height: 5px;
            background-color: #a52530;
            border-radius: 5px;
        }

        .map {
            width: 180px;
            max-width: 45%;
            height: auto;
            display: block;
        }

        .instruction {
            font-size: 18px;
            color: #55545b;
            line-height: 1.9;
            margin: 20px auto;
        }

        .signatures {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 35px auto 20px;
        }

        .signature {
            flex: 1;
            max-width: 300px;
            min-width: 0;
            border-bottom: 2px solid #a52530;
            padding: 15px 5px;
            font-size: 18px;
            font-weight: bold;
            color: #292b35;
            cursor: pointer;
            user-select: none;
            min-height: 70px;
        }

        .hearts {
            display: block;
            color: #a52530;
            font-size: 25px;
            margin-top: 8px;
            overflow-wrap: anywhere;
        }

        .slogan {
            font-size: 25px;
            font-weight: bold;
            color: #a52530;
            margin-top: 30px;
            line-height: 1.8;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            background-color: #a52530;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
        }

        button:hover {
            background-color: #801c25;
        }

        .credits {
            color: #f8f4e9;
            text-align: center;
            font-size: 17px;
            line-height: 1.8;
            margin: 22px auto 0;
            padding: 16px 5px 5px;
            border-top: 1px solid #454650;
            max-width: 900px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .page {
                padding: 25px 18px;
                min-height: auto;
            }

            .header {
                font-size: 20px;
            }

            .title {
                font-size: 43px;
            }

            .article {
                font-size: 20px;
            }

            .map-container {
                gap: 10px;
            }

            .map {
                width: 135px;
            }

            .red-line {
                height: 4px;
            }

            .instruction {
                font-size: 16px;
            }

            .signatures {
                gap: 15px;
            }

            .signature {
                font-size: 15px;
                padding: 12px 3px;
            }

            .hearts {
                font-size: 22px;
            }

            .slogan {
                font-size: 21px;
            }

            .credits {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <header class="header">
            مبادرة جميلة
        </header>

        <h1 class="title">
            المادة 34
        </h1>

        <p class="article">
            الدفاع عن العقيدة الإسلامية، والمجتمع، والوطن،
            واجب على كل مواطن.
        </p>

        <div class="map-container">

            <div class="red-line"></div>

            <img
                class="map"
                src="sa.svg"
                alt="خريطة المملكة العربية السعودية"
            >

            <div class="red-line"></div>

        </div>

        <p class="instruction">
            اترك بصمتك وعبّر عن حبك وولائك لوطنك 🇸🇦
            <br>
            اضغط على مكان التوقيع لإضافة قلب ❤️
        </p>

        <section class="signatures">

            <div class="signature" data-signature="1" role="button" tabindex="0">
                بصمتي لوطني
                <span class="hearts" id="hearts1"></span>
            </div>

            <div class="signature" data-signature="2" role="button" tabindex="0">
                عهدي لوطني
                <span class="hearts" id="hearts2"></span>
            </div>

        </section>

        <div class="slogan">
            بصمة دفاع.. السعودية خط أحمر 🇸🇦
        </div>

    </main>

    <div class="buttons">
        <button id="clearButton" type="button">
            إعادة من البداية ↺
        </button>
    </div>

    <footer class="credits">
        إعداد: أ/ نوال الثبيتي - أ/ ساره الثبيتي
    </footer>

    <script>
        const signatures = document.querySelectorAll(".signature");

        function loadHearts() {
            signatures.forEach(function (signature) {
                const number = signature.dataset.signature;
                const heartsElement = document.getElementById("hearts" + number);
                const savedHearts = Number(
                    localStorage.getItem("hearts" + number) || 0
                );

                heartsElement.textContent = "❤️".repeat(
                    Math.min(savedHearts, 100)
                );
            });
        }

        function addHeart(signature) {
            const number = signature.dataset.signature;
            const heartsElement = document.getElementById("hearts" + number);
            const currentHearts = Number(
                localStorage.getItem("hearts" + number) || 0
            );

            if (currentHearts >= 100) {
                return;
            }

            const newHearts = currentHearts + 1;

            localStorage.setItem("hearts" + number, newHearts);

            heartsElement.textContent = "❤️".repeat(newHearts);
        }

        signatures.forEach(function (signature) {
            signature.addEventListener("click", function () {
                addHeart(signature);
            });

            signature.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    addHeart(signature);
                }
            });
        });

        document.getElementById("clearButton").addEventListener("click", function () {
            localStorage.removeItem("hearts1");
            localStorage.removeItem("hearts2");
            loadHearts();
        });

        loadHearts();
    </script>

</body>
</html>
